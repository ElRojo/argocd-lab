replicaCount: 2

image:
  repository: kicbase/echo-server
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: hello.local

loadBalancer:
  tagLoadBalancer: true
tags:
  key1: value1
  key2: value2
  key3: value3
  key4: value4
  key5: value5
  key6: value6
  booltest: true
cronjobs:
  cron-on-the-cob: 
    enabled: false
    schedule: "* * * * *"
    image: "alpine:latest"
    restartPolicy: "OnFailure"
    command: "echo 'cron on the cob🌽!!'; sleep 10"
