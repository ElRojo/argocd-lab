{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hello-chart.fullname" . }}
  annotations:
  {{- if and .Values.loadBalancer .Values.loadBalancer.tagLoadBalancer }}
    alb.ingress.kubernetes.io/tags: "uniqueName=name{{- range $key, $value := .Values.tags }},{{ $key }}={{ $value }}{{- end }}"
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hello-chart.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
